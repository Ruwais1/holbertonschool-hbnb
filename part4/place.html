<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="icon" href="image/icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="image/logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
        </nav>
    </header>

    <main>
        <!-- Place Details Container -->
        <section id="place-details" class="place-details">
            <div class="place-info">
                <!-- Data will be loaded here dynamically -->
            </div>

            <div class="reviews">
                <h2>Reviews</h2>
                <!-- Reviews will be loaded here dynamically -->
            </div>

            <!-- Add Review Section -->
            <div id="add-review" class="add-review" style="display: none;">
                <a href="add_review.html" class="details-button">Add a Review</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
