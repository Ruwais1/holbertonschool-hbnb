<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="image/logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <section id="place-details" class="place-details">
            <div class="place-info">
                <h1>Cozy Apartment in Riyadh</h1>
                <p><strong>Host:</strong> Fahad Almidaj</p>
                <p><strong>Price:</strong> $50 per night</p>
                <p><strong>Description:</strong> A beautiful place in Riyadh.</p>
                <p><strong>Amenities:</strong> WiFi, AC</p>
            </div>

            <div class="reviews">
                <h2>Reviews</h2>
                <article class="review-card">
                    <p><strong>User:</strong> Ahmed</p>
                    <p><strong>Rating:</strong> 5/5</p>
                    <p><strong>Comment:</strong> Amazing place!</p>
                </article>
            </div>

            <div id="add-review" class="add-review">
                <a href="add_review.html" class="details-button">Add a Review</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>
</body>
</html>
